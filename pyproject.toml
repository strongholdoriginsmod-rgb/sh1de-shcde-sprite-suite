[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stronghold-europe-de"
version = "0.1.0"
description = "Private local builder for a Stronghold Europe-style SHCDE mod"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Private local project; no game assets are licensed or distributed" }
dependencies = []

[project.optional-dependencies]
# QtWidgets, QtGui and QtTest power the integrated Windows Sandbox Studio.
gui = ["PySide6==6.10.2"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]
assets = [
  "UnityPy==1.25.3",
  "Pillow==12.3.0",
]

[project.scripts]
stronghold-europe-de = "stronghold_europe_de.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
