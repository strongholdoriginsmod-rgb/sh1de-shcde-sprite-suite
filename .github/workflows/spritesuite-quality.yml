name: SpriteSuite core quality

on:
  push:
    branches: [main]
    paths:
      - 'tools/hud_menu_*.py'
      - 'tools/suite_windows_paths.py'
      - 'tools/se_asset_package.py'
      - 'tools/origins_grafikdaten.py'
      - 'tools/suite_hud_menu_*.py'
      - 'tests/sandbox/test_hud_menu_*.py'
      - 'tests/sandbox/test_se_asset_package.py'
      - 'tests/sandbox/test_origins_grafikdaten.py'
      - 'tests/sandbox/test_suite_layout_guidance.py'
      - 'tests/sandbox/test_windows_portable_release.py'
      - '.github/workflows/spritesuite-quality.yml'
  pull_request:
    paths:
      - 'tools/hud_menu_*.py'
      - 'tools/suite_windows_paths.py'
      - 'tools/se_asset_package.py'
      - 'tools/origins_grafikdaten.py'
      - 'tools/suite_hud_menu_*.py'
      - 'tests/sandbox/test_hud_menu_*.py'
      - 'tests/sandbox/test_se_asset_package.py'
      - 'tests/sandbox/test_origins_grafikdaten.py'
      - 'tests/sandbox/test_suite_layout_guidance.py'
      - 'tests/sandbox/test_windows_portable_release.py'
      - '.github/workflows/spritesuite-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spritesuite-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata-and-export:
    name: Windows x64 / Python ${{ matrix.python-version }} / metadata and export
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-py313-win_amd64.lock
      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Pillow==12.3.0" "UnityPy==1.25.3" "pytest==8.4.2"
          python -m pip check
      - name: Compile source
        run: python -m compileall -q tools src
      - name: Verify native Tk is available for GUI tests
        run: python -c "import tkinter as tk; root=tk.Tk(); root.withdraw(); root.destroy(); print('WINDOWS_TK_READY=1')"
      - name: Run metadata, layout and security regressions
        env:
          PYTHONPATH: '${{ github.workspace }}\tools;${{ github.workspace }}\src'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: >-
          python -m pytest -q -p no:cacheprovider --maxfail=1
          tests/sandbox/test_hud_menu_metadata_paths.py
          tests/sandbox/test_hud_menu_project_transfer.py
          tests/sandbox/test_se_asset_package.py
          tests/sandbox/test_origins_grafikdaten.py
          tests/sandbox/test_hud_menu_workshop.py
          tests/sandbox/test_hud_menu_workshop_gui.py
          tests/sandbox/test_suite_layout_guidance.py
          tests/sandbox/test_hud_menu_layout.py
          tests/sandbox/test_hud_menu_session.py
          tests/sandbox/test_hud_menu_noesis_integration.py
          tests/sandbox/test_windows_portable_release.py
