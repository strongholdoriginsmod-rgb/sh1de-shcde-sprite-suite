name: SpriteSuite specialist tools quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spritesuite-specialists-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-specialist-suite:
    name: Windows x64 / Python ${{ matrix.python }} / all specialist tests
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.13'
            lock: 'requirements-py313-win_amd64.lock'
          - python: '3.14'
            lock: 'requirements-py314-win_amd64.lock'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      - name: Install hash-pinned application and test dependencies
        run: |
          python -m pip install --require-hashes -r "${{ matrix.lock }}"
          python -m pip check
      - name: Compile Python tools and source
        run: python -m compileall -q tools src
      - name: Verify native GUI libraries
        run: |
          python -c "import tkinter as tk; root=tk.Tk(); root.withdraw(); root.destroy(); print('TK_READY=1')"
          python -c "from PySide6.QtWidgets import QApplication; app=QApplication([]); print('QT_READY=1'); app.quit()"
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Run complete regression suite including tool imports and help
        env:
          PYTHONPATH: '${{ github.workspace }}\tools;${{ github.workspace }}\src'
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: >-
          python -m pytest -q -p no:cacheprovider -p pytest_cov
          --junitxml=pytest-specialists.xml
          --cov=tools --cov=src/stronghold_europe_de
          --cov-report=json:coverage-specialists.json
          --cov-report=term:skip-covered
          tests
      - name: Preserve independently inspectable test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spritesuite-specialists-${{ matrix.python }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            pytest-specialists.xml
            coverage-specialists.json
