<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>Stronghold Sprite Editor</title>
<style>:root {
    color-scheme:light;
    --bg:#f6f7f8;
    --panel:#fff;
    --text:#24282e;
    --muted:#707780;
    --border:#dde1e5;
    --subtle:#f2f4f6;
    --accent:#3268b2;
    --accent-hover:#295b9d;
    --selected:#eaf1fa;
    --error:#a83232;
    --warning:#8a6021;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:13px;
    line-height:1.45
}
* {
    box-sizing:border-box
}
body {
    margin:0;
    color:var(--text);
    background:var(--bg);
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column
}
button,input,select,textarea {
    font:inherit;
    color:inherit
}
button,select,input,textarea {
    border:1px solid var(--border);
    border-radius:4px;
    background:var(--panel)
}
button {
    padding:6px 11px;
    cursor:pointer;
    white-space:nowrap;
    line-height:1.35
}
button:hover {
    background:var(--subtle);
    border-color:#c6cdd4
}
button:disabled {
    opacity:.42;
    cursor:default
}
button:disabled:hover {
    background:var(--panel)
}
button.primary {
    background:var(--accent);
    color:white;
    border-color:var(--accent)
}
button.primary:hover {
    background:var(--accent-hover)
}
button.quiet {
    background:transparent;
    border-color:transparent
}
button.quiet:hover {
    background:var(--subtle)
}
button.small {
    font-size:12px;
    padding:4px 8px
}
button.active,button[aria-pressed=true] {
    background:var(--selected);
    border-color:#a8c0df;
    color:#245798
}
input,select {
    min-width:0;
    padding:6px 8px;
    height:31px
}
input[type=checkbox] {
    accent-color:var(--accent);
    height:14px;
    width:14px;
    padding:0;
    margin:0;
    flex-shrink:0
}
input[type=range] {
    padding:0
}
input[type=number] {
    font-variant-numeric:tabular-nums
}
textarea {
    padding:8px;
    resize:vertical;
    min-height:74px;
    width:100%
}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible {
    outline:2px solid #75a1d6;
    outline-offset:1px
}
button:focus:not(:focus-visible) {
    outline:none
}
h1,h2,h3,p {
    margin:0
}
h1,h2,h3 {
    font-weight:600
}
h1 {
    font-size:13px
}
h2 {
    font-size:16px
}
h3 {
    font-size:12px
}
hr {
    border:0;
    border-top:1px solid var(--border);
    margin:5px 0
}
kbd {
    font-family:inherit;
    font-size:11px;
    color:var(--muted);
    font-weight:400
}
label {
    color:var(--muted);
    font-size:12px
}
.muted {
    color:var(--muted)
}
.sr-only {
    position:absolute;
    width:1px;
    height:1px;
    overflow:hidden;
    clip:rect(0,0,0,0)
}
[hidden] {
    display:none!important
}
.app-header {
    height:53px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 16px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    z-index:15
}
.brand {
    font-size:15px;
    font-weight:620;
    letter-spacing:-.25px;
    margin-right:14px
}
.header-separator {
    height:22px;
    width:1px;
    background:var(--border);
    margin:0 3px
}
.icon-button {
    font-size:21px;
    line-height:20px;
    padding:4px 7px;
    background:transparent;
    border-color:transparent
}
.project-title {
    margin:0 auto;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:34vw;
    font-size:12px;
    color:var(--muted);
    text-align:center
}
.menu {
    position:relative
}
.menu summary {
    list-style:none;
    cursor:pointer;
    padding:7px 8px;
    border-radius:4px
}
.menu summary::-webkit-details-marker {
    display:none
}
.menu summary:hover,.menu[open] summary {
    background:var(--subtle)
}
.menu-popup {
    position:absolute;
    top:35px;
    left:0;
    background:var(--panel);
    border:1px solid var(--border);
    box-shadow:0 6px 22px #18222e1c;
    padding:5px;
    min-width:248px;
    border-radius:6px;
    max-height:calc(100dvh - 100px);
    overflow:auto
}
.menu-popup button {
    width:100%;
    text-align:left;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    border:0;
    background:transparent;
    padding:8px
}
.sidebar-toggle {
    display:none
}
.workspace {
    display:grid;
    grid-template-columns:240px minmax(240px,1fr) 282px;
    flex:1;
    min-height:0
}
.files-panel {
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    min-height:0
}
.panel-heading {
    height:43px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 13px
}
.file-filters {
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:0 12px 12px
}
.file-filters select {
    width:100%;
    font-size:12px
}
.file-filters input {
    background:var(--bg)
}
.asset-list {
    overflow:auto;
    min-height:0;
    flex:1;
    position:relative;
    outline:none
}
.asset-list:focus-visible {
    box-shadow:inset 0 0 0 2px #75a1d6
}
#asset-space {
    position:relative
}
.asset-row {
    position:absolute;
    left:0;
    width:100%;
    height:52px;
    border:0;
    border-radius:0;
    background:transparent;
    padding:6px 12px;
    display:flex;
    align-items:center;
    text-align:left;
    gap:10px
}
.asset-row:hover {
    background:#f5f7f9
}
.asset-row[aria-selected=true] {
    background:var(--selected);
    color:var(--text);
    box-shadow:inset 3px 0 var(--accent)
}
.asset-row.hidden-asset {
    opacity:.5
}
.asset-thumb {
    width:36px;
    height:36px;
    object-fit:contain;
    image-rendering:pixelated;
    flex-shrink:0;
    background:var(--bg);
    border-radius:3px
}
.asset-text {
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:2px
}
.asset-name {
    font-size:12px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap
}
.asset-sub {
    font-size:10px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap
}
.file-footer {
    display:flex;
    align-items:center;
    padding:7px 9px;
    border-top:1px solid var(--border);
    gap:3px;
    min-height:39px;
    font-size:11px;
    color:var(--muted)
}
.file-footer>span {
    margin-right:auto
}
.empty-files {
    color:var(--muted);
    padding:20px 14px;
    font-size:12px
}
.editor {
    display:flex;
    flex-direction:column;
    min-height:0;
    min-width:0;
    overflow:auto
}
.view-tabs {
    height:44px;
    display:flex;
    align-items:stretch;
    gap:4px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    padding:0 15px;
    flex-shrink:0;
    overflow-x:auto
}
.view-tabs button {
    border:0;
    border-bottom:2px solid transparent;
    background:transparent;
    border-radius:0;
    padding:9px 13px;
    font-size:12px;
    color:var(--muted)
}
.view-tabs button:hover {
    background:var(--subtle)
}
.view-tabs button.active {
    color:var(--text);
    border-bottom-color:var(--accent);
    font-weight:600;
    background:transparent
}
.canvas-toolbar {
    min-height:40px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 12px;
    border-bottom:1px solid var(--border);
    background:var(--bg);
    flex-shrink:0;
    flex-wrap:wrap
}
.tool-cluster {
    display:flex;
    gap:4px;
    align-items:center
}
.view-options {
    gap:12px;
    margin-left:auto
}
.check {
    display:flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
    cursor:pointer;
    color:var(--text)
}
.compact-select {
    height:26px;
    padding:2px 4px;
    font-size:11px;
    background:transparent;
    max-width:117px
}
.zoom-readout {
    min-width:52px;
    font-variant-numeric:tabular-nums
}
.canvas-wrap {
    flex:1;
    min-height:100px;
    position:relative;
    overflow:hidden;
    background-color:#e8ebee;
    isolation:isolate
}
.canvas-wrap.checker {
    background-image:conic-gradient(#e2e5e8 25%,#e9ecef 0 50%,#e2e5e8 0 75%,#e9ecef 0);
    background-size:20px 20px
}
.canvas-wrap.light {
    background:#fafafa
}
.canvas-wrap.dark {
    background:#252930
}
#viewport {
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
    outline:none
}
#viewport:focus-visible {
    box-shadow:inset 0 0 0 2px #75a1d6
}
.empty-state {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:13px;
    pointer-events:none
}
.empty-state p {
    font-size:16px;
    font-weight:500;
    color:#565f6b
}
.empty-state span {
    font-size:11px;
    color:#727b85
}
.empty-state button {
    pointer-events:auto;
    background:#ffffffc9;
    padding:7px 14px
}
.canvas-note {
    position:absolute;
    top:13px;
    left:14px;
    right:14px;
    pointer-events:none;
    color:var(--muted);
    background:#ffffffeb;
    border:1px solid var(--border);
    border-radius:4px;
    padding:7px 10px;
    font-size:12px;
    width:max-content;
    max-width:calc(100% - 28px)
}
.drop-overlay {
    position:absolute;
    inset:10px;
    border:2px dashed var(--accent);
    background:#eaf1faed;
    z-index:12;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    color:var(--accent)
}
.context-bar {
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:9px;
    min-height:41px;
    padding:7px 12px;
    background:var(--panel);
    border-top:1px solid var(--border);
    flex-wrap:wrap;
    font-size:11px
}
.context-bar select {
    font-size:12px;
    height:28px;
    padding:3px 6px
}
.context-bar input[type=number] {
    width:52px;
    height:27px;
    font-size:11px;
    padding:3px
}
.context-bar input[type=range] {
    flex:1;
    min-width:70px;
    height:22px;
    accent-color:var(--accent)
}
.context-bar label {
    font-size:11px
}
.context-bar .muted {
    margin-left:auto
}
.status-bar {
    height:27px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 12px;
    font-size:10px;
    font-variant-numeric:tabular-nums;
    color:var(--muted);
    background:var(--panel);
    border-top:1px solid var(--border);
    flex-shrink:0;
    white-space:nowrap;
    overflow:hidden
}
#status-left {
    overflow:hidden;
    text-overflow:ellipsis
}
#status-middle {
    margin-left:auto
}
#recovery-status {
    padding-left:12px;
    border-left:1px solid var(--border)
}
.inspector {
    background:var(--panel);
    border-left:1px solid var(--border);
    display:flex;
    flex-direction:column;
    min-height:0
}
.inspector-tabs {
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:0;
    align-items:stretch;
    min-height:44px;
    flex-shrink:0;
    border-bottom:1px solid var(--border);
    padding:0 8px
}
.inspector-tabs button {
    min-width:0;
    font-size:11px;
    border:0;
    border-radius:0;
    border-bottom:2px solid transparent;
    padding:8px 4px;
    line-height:1.25;
    white-space:normal;
    overflow-wrap:anywhere;
    background:transparent;
    color:var(--muted)
}
.inspector-tabs button.active {
    font-weight:600;
    color:var(--text);
    border-bottom-color:var(--accent)
}
.inspector-content {
    overflow:auto;
    min-height:0;
    flex:1;
    padding-bottom:12px
}
.inspector-content button {
    max-width:100%;
    white-space:normal;
    overflow-wrap:anywhere
}
.inspector-content .check {
    white-space:normal
}
.inspector-section {
    padding:15px 14px;
    border-bottom:1px solid var(--border)
}
.inspector-section h3 {
    font-size:12px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    overflow-wrap:anywhere
}
.fields {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px
}
.field {
    display:flex;
    flex-direction:column;
    gap:4px;
    min-width:0
}
.field.wide {
    grid-column:1/-1
}
.field input,.field select {
    width:100%;
    font-size:12px
}
.field label {
    font-size:11px
}
.field-inline {
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:9px;
    flex-wrap:wrap
}
.field-inline button {
    font-size:11px;
    padding:5px 8px;
    flex:1
}
.field-inline .check {
    font-size:12px;
    flex:1
}
.info-line {
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    font-size:11px;
    margin:7px 0;
    color:var(--muted)
}
.info-line span:last-child {
    color:var(--text);
    text-align:right;
    overflow-wrap:anywhere;
    font-variant-numeric:tabular-nums
}
.inspector-note {
    font-size:11px;
    color:var(--muted);
    line-height:1.55;
    margin:10px 0 0
}
.inspector-empty {
    padding:20px 14px;
    color:var(--muted);
    font-size:12px
}
.issue-summary {
    display:flex;
    gap:14px;
    margin-bottom:10px;
    font-size:12px
}
.error-text {
    color:var(--error)
}
.warning-text {
    color:var(--warning)
}
.issue {
    display:block;
    white-space:normal;
    border:0;
    border-radius:0;
    border-left:2px solid #d6b77e;
    background:transparent;
    width:100%;
    text-align:left;
    padding:8px 10px;
    margin:0 0 9px;
    font-size:11px;
    line-height:1.5
}
.issue.error {
    border-left-color:#c86e6e
}
.issue span {
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-bottom:3px;
    overflow-wrap:anywhere
}
.progress-note {
    font-size:12px;
    color:var(--muted);
    padding:14px
}
.mini-stats {
    font-size:11px;
    line-height:1.75;
    color:var(--muted)
}
.recovery-bar {
    background:#f4f0e5;
    border-bottom:1px solid #e0d6b9;
    display:flex;
    gap:10px;
    align-items:center;
    padding:5px 16px;
    font-size:12px
}
.recovery-bar button {
    padding:3px 8px;
    font-size:11px
}
.recovery-bar span {
    margin-right:auto
}
.modal {
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--border);
    padding:0;
    border-radius:8px;
    width:min(600px,calc(100vw - 36px));
    max-height:calc(100dvh - 70px);
    box-shadow:0 18px 70px #1723352e
}
.modal::backdrop,.busy-dialog::backdrop {
    background:#17213055
}
.modal form {
    display:flex;
    flex-direction:column;
    max-height:calc(100dvh - 74px)
}
.modal header {
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
    padding:15px 20px
}
.close-dialog {
    font-size:23px;
    padding:0 4px;
    line-height:24px
}
.modal-content {
    flex:1;
    padding:20px;
    overflow:auto;
    min-height:0
}
.modal footer {
    flex-shrink:0;
    padding:13px 20px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:flex-end;
    gap:8px;
    background:var(--bg)
}
.modal .fields {
    gap:15px
}
.modal .field input,.modal .field select {
    font-size:13px;
    height:34px
}
.modal .field label {
    font-size:12px
}
.modal p {
    font-size:12px;
    color:var(--muted);
    line-height:1.65;
    margin:13px 0
}
.modal .check {
    font-size:12px;
    white-space:normal
}
.modal .field-inline {
    margin:15px 0
}
.modal .wide-button {
    width:100%;
    text-align:left;
    padding:11px;
    white-space:normal
}
.modal .file-selection {
    padding:10px 12px;
    border:1px dashed #bdc7d2;
    border-radius:5px;
    color:var(--muted);
    font-size:12px;
    margin-bottom:15px;
    overflow-wrap:anywhere
}
.modal .section-title {
    font-size:12px;
    font-weight:600;
    margin:20px 0 9px
}
.form-error {
    color:var(--error);
    background:#fcf0f0;
    border-top:1px solid #f0d6d6;
    padding:10px 20px;
    font-size:12px;
    overflow-wrap:anywhere
}
.help-table {
    width:100%;
    border-collapse:collapse;
    font-size:12px
}
.help-table td {
    padding:7px 0;
    vertical-align:top;
    border-bottom:1px solid var(--border)
}
.help-table td:first-child {
    min-width:110px;
    padding-right:20px;
    font-weight:500
}
.help-heading {
    font-size:13px;
    margin:18px 0 8px
}
.help-link {
    color:var(--accent);
    text-decoration:none;
    overflow-wrap:anywhere
}
.help-link:hover {
    text-decoration:underline
}
.busy-dialog {
    width:min(420px,90vw);
    border:1px solid var(--border);
    padding:23px;
    border-radius:8px;
    background:var(--panel);
    color:var(--text)
}
.busy-dialog progress {
    display:block;
    width:100%;
    height:5px;
    margin:18px 0 9px;
    accent-color:var(--accent)
}
.busy-dialog p {
    color:var(--muted);
    font-size:11px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    margin-bottom:16px
}
.busy-dialog button {
    float:right
}
.toast {
    position:fixed;
    left:50%;
    bottom:42px;
    transform:translateX(-50%);
    background:#fff;
    box-shadow:0 5px 24px #1a253026;
    border:1px solid var(--border);
    border-radius:6px;
    z-index:60;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px 10px 16px;
    max-width:min(680px,90vw);
    font-size:12px
}
.toast.error {
    border-color:#dfb1b1;
    color:var(--error)
}
.toast button {
    padding:0 4px;
    font-size:20px;
    color:var(--muted)
}
@media(min-width:1700px) {
    .workspace {
        grid-template-columns:260px minmax(240px,1fr) 310px
    }
    .inspector-section {
        padding:17px 18px
    }
}
@media(max-width:1150px) {
    .workspace {
        grid-template-columns:212px minmax(230px,1fr) 248px
    }
    .app-header {
        padding:0 10px;
        gap:5px
    }
    .brand {
        margin-right:7px
    }
    .canvas-toolbar {
        gap:6px
    }
    .view-tabs {
        padding:0 8px;
        gap:0
    }
    .view-tabs button {
        padding:10px 11px
    }
    .view-options {
        gap:8px
    }
    .inspector-section {
        padding:12px
    }
    .inspector-tabs {
        padding:0 3px
    }
    .inspector-tabs button {
        padding:10px 5px
    }
    .asset-row {
        padding-left:10px;
        gap:8px
    }
    .file-footer {
        padding:7px 6px
    }
    .file-footer button {
        padding:4px 5px
    }
}
@media(max-width:960px) {
    .workspace {

  <aside id="files-panel" class="files-panel" aria-label="Dateien">

      <label class="sr-only" for="search">Dateien filtern</label><input id="search" type="search" placeholder="Dateien filtern" autocomplete="off"></div>

  </aside>
</main>

<script>/* Stronghold Sprite Editor. Pure geometry and RGBA operations; no DOM or I/O. */
(function (root, factory) {
    'use strict';
    const api = factory();
    if (typeof module === 'object' && module.exports)
        module.exports = api;
    else
        root.SpriteCore = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
    'use strict';
    /**
     * Raw, top-left-origin RGBA8 samples. Alpha is unassociated (straight).
     * Geometry functions allocate new buffers and never mutate an input image.
     * @typedef {{width:number, height:number, data:Uint8Array|Uint8ClampedArray}} RGBAImage
     */
    /** @typedef {{x:number, y:number}} NormalizedPivot Bottom-left origin, both in [0,1]. */
    const VERSION = '1.0.0';
    const LIMITS = Object.freeze({
        side: 16384, pixels: 16777216, totalPixels: 33554432,
        frames: 4096, entries: 12288, fileBytes: 67108864, importBytes: 134217728, archiveBytes: 201326592
    });
    const DEFAULT_SCENE = Object.freeze({ a: 5, b: 5, width: 64, height: 32, padding: 8, order: 'ascending', anchor: 'bottom', category: 'building' });
    const MATERIALS = Object.freeze(['Auto', 'Plain', 'TeamColour', 'Foliage']);
    const fail = message => {
        throw new Error(message);
    };
    function number(value, label, min = -Infinity, max = Infinity) {
        if (value === '' || value === null || typeof value === 'boolean' || typeof value === 'object')
            fail(`${label}: Zahl erforderlich.`);
        const n = Number(value);
        if (!Number.isFinite(n) || n < min || n > max)
            fail(`${label}: Zahl zwischen ${min} und ${max} erforderlich.`);
        return n;
    }
    function integer(value, label, min = -LIMITS.side, max = LIMITS.side) {
        const n = number(value, label, min, max);
        if (!Number.isSafeInteger(n))
            fail(`${label}: ganze Zahl erforderlich.`);
        return n;
    }
    function dimensions(width, height) {
        integer(width, 'Breite', 1, LIMITS.side);
        integer(height, 'Höhe', 1, LIMITS.side);
        if (width * height > LIMITS.pixels)
            fail(`Bild ${width} × ${height} überschreitet 16 Megapixel.`);
        return { width, height };
    }
    function image(width, height, data) {
        dimensions(width, height);
        if (data && (!(data instanceof Uint8Array || data instanceof Uint8ClampedArray) || data.length !== width * height * 4))
            fail('Ungültiger RGBA-Puffer.');
        return { width, height, data: data || new Uint8Array(width * height * 4) };
    }
    function scene(raw = {}) {
        const r = { ...DEFAULT_SCENE, ...raw }, s = {
            a: integer(r.a, 'Raster links', 1, 64), b: integer(r.b, 'Raster rechts', 1, 64),
            width: integer(r.width, 'Tilebreite', 2, 2048), height: integer(r.height, 'Rautenhöhe', 2, 2048),
            padding: integer(r.padding, 'Rand', 0, 1024), order: r.order, anchor: r.anchor, category: r.category
        };
        if (s.width % 2 || s.height % 2)
            fail('Tilebreite und Rautenhöhe müssen gerade sein.');
        if (!['ascending', 'descending'].includes(s.order))
            fail('Unbekannte Ebenenreihenfolge.');
        if (!['bottom', 'pivot'].includes(s.anchor))
            fail('Unbekannte Ankerbasis.');
        if (!['building', 'unit', 'vegetation', 'other'].includes(s.category))
            fail('Unbekannter Assettyp.');
        return s;
    }
    /** Front to back, left to right within each horizontal diagonal; zero-based slots. */
    function positions(raw) {
        const s = scene(raw), out = [];
        for (let d = 0; d < s.a + s.b - 1; d++)
            for (let u = Math.min(s.a - 1, d); u >= Math.max(0, d - s.b + 1); u--) {
                const v = d - u;
                out.push({ slot: out.length, u, v, diagonal: d, x: (v - u) * s.width / 2, bottom: d === 0 ? 0 : -d * s.height / 2 });
            }
        return out;
    }
    function footprint(raw) {
        const s = scene(raw);
        return { left: -s.a * s.width / 2, right: s.b * s.width / 2, top: -(s.a + s.b) * s.height / 2, bottom: 0 };
    }
    function pivot(raw = { x: .5, y: 0 }) {
        return { x: number(raw.x, 'Pivot X', 0, 1), y: number(raw.y, 'Pivot Y', 0, 1) };
    }
    function pixelAnchor(frame, img, usePivot = true) {
        const p = pivot(frame.pivot);
        return usePivot ? { x: img.width * p.x, y: img.height * (1 - p.y) } : { x: Math.floor(img.width / 2), y: img.height };
    }
    /** Shared pixel-space geometry for pivots, overlay comparisons and measurements.
     * Image coordinates are top-left origin; persisted pivots use bottom-left. */
    function snapCoordinate(value, step = 1) {
        number(step, 'Snap-Abstand', 0.001, 4096);
        return Math.round(number(value, 'Koordinate', -LIMITS.side, LIMITS.side) / step) * step;
    }
    function pivotFromPixel(img, x, y, snapped = true) {
        dimensions(img.width, img.height);
        const px = snapped ? snapCoordinate(x) : number(x, 'X');
        const py = snapped ? snapCoordinate(y) : number(y, 'Y');
        if (px < 0 || px > img.width || py < 0 || py > img.height)
            fail('Ankerpunkt liegt außerhalb des Sprites.');
        return pivot({ x: px / img.width, y: 1 - py / img.height });
    }
    function measurePoints(from, to, snapStep = 1) {
        if (!from || !to)
            fail('Messung benötigt Anfang und Ende.');
        const start = { x: snapCoordinate(from.x, snapStep), y: snapCoordinate(from.y, snapStep) };
        const end = { x: snapCoordinate(to.x, snapStep), y: snapCoordinate(to.y, snapStep) };
        const dx = end.x - start.x, dy = end.y - start.y;
        return { start, end, dx, dy, length: Math.hypot(dx, dy),
            angleDegrees: Math.atan2(-dy, dx) * 180 / Math.PI };
    }
    /** One source of truth for inverse-nearest image-generator registration.
     * Damage requests and generic AI sprites must use identical pixel geometry. */
    function modelRegistrationPlan(img) {
        dimensions(img.width, img.height);
        const landscape = img.width > img.height * 1.25;
        const portrait = img.height > img.width * 1.25;
        const width = landscape ? 1536 : 1024, height = portrait ? 1536 : 1024;
        const scale = Math.floor(Math.min((width - 128) / img.width,
            (height - 128) / img.height));
        if (scale < 1) return null; // Never silently downsample the source.
        return { width, height, scale,
            left: Math.floor((width - img.width * scale) / 2),
            top: height - 64 - img.height * scale,
            sourceWidth: img.width, sourceHeight: img.height };
    }
    function modelRegisteredImage(img, plan) {
        dimensions(img.width, img.height);
        if (!plan || !Number.isSafeInteger(plan.scale) || plan.scale < 1 ||
                img.width !== plan.sourceWidth || img.height !== plan.sourceHeight ||
                !Number.isSafeInteger(plan.left) || !Number.isSafeInteger(plan.top) ||
                !Number.isSafeInteger(plan.width) || !Number.isSafeInteger(plan.height) ||
                plan.left < 0 || plan.top < 0 ||
                plan.left + img.width * plan.scale > plan.width ||
                plan.top + img.height * plan.scale > plan.height)
            fail('Bildregistrierung ist ungültig oder passt nicht zur Vorlage.');
        const out = image(plan.width, plan.height);
        const scaled = plan.scale === 1 ? img :
            resize(img, img.width * plan.scale, img.height * plan.scale);
        // Raw rows preserve hidden RGB, alpha and all original pixel samples.
        blit(out, scaled, plan.left, plan.top);
        return out;
    }
    function layout(frames, raw, getImage) {
        const s = scene(raw), ps = positions(s), f = footprint(s), used = new Set();
        let left = f.left, top = f.top, right = f.right, bottom = f.bottom;
        const placed = frames.map(frame => {
            const slot = integer(frame.slot, 'Rasterplatz', 0, ps.length - 1);
            if (used.has(slot))
                fail(`Rasterplatz ${slot + 1} ist doppelt belegt.`);
            used.add(slot);
            const img = getImage(frame.imageId), a = pixelAnchor(frame, img, s.anchor === 'pivot');
            const dx = integer(frame.dx, 'X-Versatz'), dy = integer(frame.dy, 'Y-Versatz');
            const x = Math.round(ps[slot].x - a.x) + dx, y = Math.round(ps[slot].bottom - a.y) + dy;
            left = Math.min(left, x);
            right = Math.max(right, x + img.width);
            top = Math.min(top, y);
            bottom = Math.max(bottom, y + img.height);
            return { id: frame.id, frame, slot, x, y, width: img.width, height: img.height, anchorX: ps[slot].x + dx, anchorY: ps[slot].bottom + dy };
        });
        left = Math.floor(left) - s.padding;
        top = Math.floor(top) - s.padding;
        right = Math.ceil(right) + s.padding;
        bottom = Math.ceil(bottom) + s.padding;
        const dims = dimensions(right - left, bottom - top);
        for (const p of placed) {
            p.x -= left;
            p.y -= top;
            p.anchorX -= left;
            p.anchorY -= top;
        }
        const paint = [...placed].sort((a, b) => s.order === 'ascending' ? a.slot - b.slot : b.slot - a.slot);
        return { ...dims, left, top, originX: -left, originY: -top, placed, paint, positions: ps, settings: s };
    }
    /** Exact copy, optionally source-over. RGBA stays unassociated; no canvas round-trip. */
    function blit(dst, src, x, y, blend = false) {
        integer(x, 'X');
        integer(y, 'Y');
        const sx = Math.max(0, -x), sy = Math.max(0, -y), ex = Math.min(src.width, dst.width - x), ey = Math.min(src.height, dst.height - y);
        if (ex <= sx || ey <= sy)
            return dst;
        for (let yy = sy; yy < ey; yy++) {
            if (!blend) {
                dst.data.set(src.data.subarray((yy * src.width + sx) * 4, (yy * src.width + ex) * 4), ((yy + y) * dst.width + x + sx) * 4);
                continue;
            }
            for (let xx = sx; xx < ex; xx++) {
                const si = (yy * src.width + xx) * 4, di = ((yy + y) * dst.width + xx + x) * 4, sa = src.data[si + 3];
                if (sa === 0)
                    continue;
                const da = dst.data[di + 3];
                if (sa === 255 || da === 0) {
                    dst.data.set(src.data.subarray(si, si + 4), di);
                    continue;
                }
                const a = sa * 255 + da * (255 - sa);
                for (let c = 0; c < 3; c++)
                    dst.data[di + c] = Math.round((src.data[si + c] * sa * 255 + dst.data[di + c] * da * (255 - sa)) / a);
                dst.data[di + 3] = Math.round(a / 255);
            }
        }
        return dst;
    }
    function compose(l, getImage, mask = false) {
        const dst = image(l.width, l.height);

            fields(field('Name der Version', base.name + ' v2', { name: 'label', wide: true })),

                const files = await askFiles('.png', false);

                    applyVersion(baseId, label, image, data.has('fit'));

    function damagePreview(img, label) {

        const small = width === img.width && height === img.height ? img : C.resize(img, width, height);
        const canvas = el('canvas', { class: 'damage-review-canvas', width, height,
            title: label, 'aria-label': label });

    /** Historical in-game ruler data is now a specialist input to this canvas. */
    function legacyPivotReview(frame = primary()) {
        if (!legacyPivotFile || !frame) return null;
        const found = legacyPivotFile.rows.filter(row =>
            PE.matchesFrame(row, frame));
        if (found.length !== 1) return null;
        return PE.review(found[0], state().frames, store());
    }
    async function loadLegacyPivotFile() {
        const files = await askFiles('.json', false);
        if (!files.length) return;
        if (files.length !== 1 || files[0].size > 2 * 1024 * 1024)
            throw new Error('Nur eine Zinnenlineal-JSON-Datei bis 2 MiB wählen.');
        await task('Zinnen-Messdaten ohne Spieländerung lesen', async opts => {
            const bytes = new Uint8Array(await files[0].arrayBuffer());
            K.aborted(opts.signal);
            const decoded = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
            const rows = PE.parseMeasurements(decoded);
            const sourceSHA256 = await K.sha256(bytes);
            legacyPivotFile = { rows, filename: C.safeName(files[0].name), sourceSHA256 };
            showLegacyPivot = true;
            panel = 'geometry';
            message(rows.length + ' historische Zinnenlineal-Messungen geladen; keine Sprites geändert.');
        });
    }
    function showLegacyPivotOverlay() {
        const review = legacyPivotReview();
        if (!review) throw new Error('Kein eindeutiger Zinnenlineal-Eintrag für diesen Sprite.');
        if (!['review', 'already'].includes(review.status))
            throw new Error(review.reason);
        showLegacyPivot = true;
        $('compare').value = 'current';
        setView('sprite');
        requestDraw();
    }
    function applyLegacyPivotReview() {
        const frame = primary(), file = legacyPivotFile, review = legacyPivotReview();
        if (!file || !frame || !review || review.status !== 'review')
            throw new Error('Keine prüfbare Pivot-Messung für den ausgewählten Sprite.');
        const boundImageId = frame.imageId, row = review.row;
        modal('Gemessenen Pivot einzeln übernehmen', [
            note('Geometrievorschlag aus ' + file.filename + '. Die Grafik bleibt unverändert; ' +
                'weder BC7-Atlas noch installierte SHCDE-Dateien werden verändert.'),
            line('Sprite', frame.name),
            line('Messung', row.name + ' · rechts ' + row.right + ' / hoch ' + row.up + ' px'),
            line('Ausgangspivot', row.oldPivot.x.toFixed(6) + ' / ' + row.oldPivot.y.toFixed(6)),
            line('Zielpivot', row.newPivot.x.toFixed(6) + ' / ' + row.newPivot.y.toFixed(6)),
            line('Messquellen-SHA', file.sourceSHA256.slice(0, 24) + '…'),
            damagePreview(store().get(frame.imageId), 'Arbeitsbild vor Pivotkorrektur'),
            fields(field('Notiz (optional)', '', { type: 'textarea', name: 'notes',
                wide: true, placeholder: 'Sichtprüfung der Grundlinie und Sprite-Position' }))
        ], 'Nur Arbeits-Pivot übernehmen', data => {
            const notes = String(data.get('notes') || '').trim();
            if (notes.length > 1200) throw new Error('Notiz überschreitet 1200 Zeichen.');
            const now = primary(), checked = legacyPivotReview();
            if (file !== legacyPivotFile || !now ||
                    now.id !== frame.id || now.imageId !== boundImageId ||
                    !checked || checked.status !== 'review' ||
                    checked.row.name !== row.name)
                throw new Error('Bild oder Messquelle hat sich geändert; Prüfung wiederholen.');
            const contentHash = I.imageContentSHA256(store().get(boundImageId));
            edit(next => {
                const updated = next.frames.find(item => item.id === frame.id);
                if (!updated || updated.locked || updated.imageId !== boundImageId)
                    throw new Error('Sprite gesperrt oder nicht mehr vorhanden.');
                updated.pivot = { ...row.newPivot };
                updated.metadataStatus = 'manual';
                updated.pivotEvidence = {
                    appliedImageId: boundImageId, measurementSHA256: file.sourceSHA256,
                    imageContentSHA256: contentHash, measuredFrameName: row.name,
                    proposedPivot: { ...row.newPivot }, reviewNotes: notes,
                    manualReview: false, approvedForGame: false
                };
            }, 'Zinnenlineal-Pivot nach visueller Prüfung');
            message('Messpivot in der Arbeitskopie übernommen; Original und Spiel unverändert.');
        });
    }
    function exportLegacyPivotReport() {

            status: result.status, reason: result.reason,
            measuredOld: result.row.oldPivot, measuredNew: result.row.newPivot,
            currentPivot: result.currentPivot || null,

    async function aiExportRequest(generate = false) {
        const frame = primary();
        if (!frame) throw new Error('Zuerst einen Sprite auswählen.');
        const sourceImageId = frame.imageId;
        const settings = AI.options({ assetClass: aiAssetClass, goal: aiGoal,
            restrictions: aiRestrictions, model: aiModel, variants: aiVariants });
        let generatedFiles = null;
        await task('KI-Anfrage mit unveränderter Bildreferenz vorbereiten', async opts => {
            const sourcePNG = await store().bytes(sourceImageId, opts.signal);
            const payload = await AI.makeRequestBundle(store().get(sourceImageId), sourcePNG, settings);
            if (primary()?.id !== frame.id || primary()?.imageId !== sourceImageId)
                throw new Error('Sprite wurde während der Anfragevorbereitung geändert.');
            aiLastRequest = { frameId: frame.id, sourceImageId,
                request: payload.request, requestSHA256: payload.requestSHA256 };
            if (generate) {
                const response = await codexCall('generate', payload.bytes);
                const bytes = new Uint8Array(await response.arrayBuffer());
                const entries = await K.unzip(bytes);
                const candidates = entries.filter(entry => /^variant_0[1-4]\.png$/.test(entry.name));
                const names = new Set(candidates.map(entry => entry.name.replace(/\.png$/, '_meta.json')));
                download(bytes, C.safeName(frame.name) + '_codex_ergebnisse.zip', 'application/zip');
                if (!candidates.length)
                    throw new Error('Modellausgabe benötigt eine erneute Ausrichtungsprüfung. Rohbilder und Belege wurden gesichert.');
                generatedFiles = entries.filter(entry => candidates.includes(entry) || names.has(entry.name))
                    .map(entry => new File([entry.data], entry.name));
            } else {
                download(payload.bytes, C.safeName(frame.name) + '_ki_auftrag.zip');
                message('KI-Auftragsbundle exportiert.');
            }
        });
        if (generatedFiles) await aiImportCandidates(generatedFiles);
    }
    async function aiImportCandidates(generatedFiles = null) {
        const frame = primary();
        if (!frame) throw new Error('Zuerst einen Sprite auswählen.');
        const files = generatedFiles || await askFiles('.png,.json', true);
        if (!files.length) return;
        const pngs = files.filter(file => /\.png$/i.test(file.name));
        const metas = files.filter(file => /_meta\.json$/i.test(file.name));
        if (pngs.length < 1 || pngs.length > 4 ||
                files.length !== pngs.length + metas.length ||
                metas.length > pngs.length || files.length > 8)
            throw new Error('Bis vier PNG-Kandidaten und optional ihre _meta.json-Dateien wählen.');
        const fileNames = new Set(files.map(file => file.name.toLowerCase()));
        if (fileNames.size !== files.length)
            throw new Error('Doppelte Kandidatendateinamen.');
        const sourceImageId = frame.imageId;
        await task('Bildvarianten und Herkunftsnachweise prüfen', async opts => {
            const original = store().get(sourceImageId), incoming = [];
            const sourceSHA256 = await K.sha256(await store().bytes(sourceImageId, opts.signal));
            const planned = aiLastRequest?.frameId === frame.id &&
                aiLastRequest?.sourceImageId === sourceImageId ?
                aiLastRequest.requestSHA256 : null;
            let totalPixels = 0;
            const usedMetas = new Set();
            for (let index = 0; index < pngs.length; index++) {
                K.aborted(opts.signal);
                const file = pngs[index];
                if (file.size > C.LIMITS.fileBytes)
                    throw new Error('Kandidatenbild ist größer als das Dateibudget.');
                const bytes = new Uint8Array(await file.arrayBuffer());
                const image = await K.decodePNG(bytes, opts);
                totalPixels += image.width * image.height;
                if (totalPixels > C.LIMITS.totalPixels)
                    throw new Error('Kandidaten überschreiten das 32-Megapixel-Arbeitsbudget.');
                const checksum = await K.sha256(bytes);
                const metaName = file.name.replace(/\.png$/i, '_meta.json').toLowerCase();
                const metaFile = metas.find(candidate => candidate.name.toLowerCase() === metaName);
                let receipt = null, receiptSHA256 = null;
                if (metaFile) {
                    if (metaFile.size > 1024 * 1024)
                        throw new Error('KI-Manifest ist zu groß.');
                    const metaBytes = new Uint8Array(await metaFile.arrayBuffer());
                    const json = C.json(new TextDecoder('utf-8', { fatal: true }).decode(metaBytes));
                    receipt = AI.verifyCandidateMetadata(json, sourceSHA256, checksum, planned);
                    receiptSHA256 = await K.sha256(metaBytes);
                    usedMetas.add(metaName);
                }
                incoming.push({ frameId: frame.id, sourceImageId,
                    name: file.name, image, sha256: checksum, receipt,
                    receiptSHA256, sourceSHA256,
                    review: AI.reviewCandidate(original, image) });
                opts.progress(index + 1, pngs.length, file.name);
                await I.tick();
            }
            if (usedMetas.size !== metas.length)
                throw new Error('Ein KI-Metadatenbeleg besitzt keinen gleichnamigen PNG-Kandidaten.');
            if (primary()?.id !== frame.id || primary()?.imageId !== sourceImageId)
                throw new Error('Sprite wurde während des Imports geändert.');
            aiCandidates = incoming;
            aiCandidateIndex = 0;
            message('KI-Varianten und vorhandene SHA-Belege geprüft; keine Bilddatei übernommen.');
        });
    }

    function renderInspector() {
        nativeApi?.invalidate();
        const root = $('inspector-content');
        root.replaceChildren();
        for (const b of document.querySelectorAll('[data-panel]'))
            b.classList.toggle('active', b.dataset.panel === panel);
        try {
            if (panel === 'target')
                root.append(...targetSection());
            else if (panel === 'damage')
                root.append(...damageSection());
            else if (panel === 'geometry')
                root.append(geometrySection(), legacyPivotSection());
            else if (panel === 'ai')
                root.append(...aiSection());
            else if (panel === 'checks')
                root.append(renderChecks());
            else {
                if (view === 'split')
                    root.append(splitSection());
                else if (view === 'atlas') {
                    root.append(atlasSection());
                    if (primary())
                        root.append(frameSection());
                }
                else {
                    if (view === 'scene') {
                        const s = sceneSection();
                        if (s)
                            root.append(s);
                    }
                    if (primary())
                        root.append(frameSection());
                    else
                        root.append(el('div', { class: 'inspector-empty', text: 'Dateien importieren, um Eigenschaften zu bearbeiten.' }));
                }
            }
        }
        catch (e) {
            root.append(note(e.message));
        }
    }

    async function replaceImage(maskOnly) {
        const ff = chosen();
        if (ff.length !== 1)
            throw new Error('Genau einen Sprite auswählen.');
        if (ff[0].locked)
            throw new Error('Sprite ist gesperrt.');
        const files = await askFiles('.png', !maskOnly);
        if (!files.length)
            return;
        await task(maskOnly ? 'Maske laden' : 'PNG ersetzen', async (opts) => {
            const entries = await I.expandFiles(files, opts), next = store().fork(), s = I.clone(state()), f = s.frames.find(t => t.id === ff[0].id);
            if (maskOnly) {
                if (entries.length !== 1)
                    throw new Error('Genau eine Maske auswählen.');
                f.maskId = await next.decode(entries[0].data, opts);
            }
            else {
                const colors = entries.filter(e => !/_m\.png$/i.test(e.name));
                if (colors.length !== 1)
                    throw new Error('Ein Farbbild und optional dessen _m.png auswählen.');
                f.imageId = await next.decode(colors[0].data, opts);
                const mask = entries.find(e => e.name.toLowerCase() === colors[0].name.replace(/\.png$/i, '_m.png').toLowerCase());
                if (mask)
                    f.maskId = await next.decode(mask.data, opts);
                if (entries.length > (mask ? 2 : 1))
                    throw new Error('Nicht zuordenbare Zusatzdateien.');
            }
            commit(s, maskOnly ? 'Maske ersetzen' : 'Bild ersetzen', next, { fit: true });
        });

    async function dbOpen() {
        if (!globalThis.indexedDB)
            throw new Error('IndexedDB nicht verfügbar.');
        return new Promise((resolve, reject) => {
            const r = indexedDB.open('StrongholdSpriteEditor', 1);
            r.onupgradeneeded = () => r.result.createObjectStore('recovery', { keyPath: 'id' });
            r.onsuccess = () => resolve(r.result);
            r.onerror = () => reject(r.error);
            r.onblocked = () => reject(new Error('Lokale Sicherung ist blockiert.'));
        });
    }
    async function dbAction(mode, fn) {
        const db = await dbOpen();
        try {
            return await new Promise((resolve, reject) => {
                const tx = db.transaction('recovery', mode), s = tx.objectStore('recovery');
                let request;
                try {
                    request = fn(s);
                }
                catch (e) {
                    tx.abort();
                    reject(e);
                    return;
                }
                tx.oncomplete = () => resolve(request?.result);
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error || new Error('Sicherung abgebrochen.'));
            });
        }
        finally {
            db.close();
        }
    }
    async function findRecovery() {
        try {
            const records = await dbAction('readonly', s => s.getAll());
            recoveryCandidate = records.sort((a, b) => b.updated - a.updated)[0] || null;
            if (recoveryCandidate) {
                $('recovery-text').textContent = `Lokale Sicherung: ${recoveryCandidate.name} · ${new Date(recoveryCandidate.updated).toLocaleString('de-DE')}`;
                $('recovery-bar').hidden = false;
            }
        }
        catch (_e) {
            recoveryEnabled = false;
            $('recovery-status').textContent = 'Ohne Autosicherung';
        }
    }
    function scheduleRecovery() {
        clearTimeout(recoveryTimer);
        if (!recoveryEnabled || (!state().frames.length && !state().split))
            return;
        recoveryTimer = setTimeout(() => saveRecovery().catch(e => {
            recoveryEnabled = false;
            $('recovery-status').textContent = 'Sicherung fehlgeschlagen';
            $('recovery-status').title = e.message + ' — Projektdatei über Speichern ausgeben.';
        }), 1700);
    }
    async function saveRecovery() {
        if (recoveryRunning) {
            recoveryAgain = true;
            return;
        }
        if (busy) {
            scheduleRecovery();
            return;
        }
        recoveryRunning = true;
        const snapshot = state(), assets = store().fork(), generation = autosaveGeneration;
        const rev = history.revision;
        try {
            $('recovery-status').textContent = 'Sichert…';
            const data = await I.writeProject(snapshot, assets);
            if (generation !== autosaveGeneration)
                return;
            await dbAction('readwrite', s => s.put({ id: sessionId, name: snapshot.project.name, updated: Date.now(), data }));
            const records = await dbAction('readonly', s => s.getAll());
            if (records.length > 6) {
                const remove = records.sort((a, b) => b.updated - a.updated).slice(6).filter(r => r.id !== sessionId);
                await dbAction('readwrite', s => {
                    for (const r of remove)
                        s.delete(r.id);
                });
            }
            $('recovery-status').textContent = 'Lokal gesichert';
            if (history.revision !== rev)
                recoveryAgain = true;

            if (recoveryAgain) {

                scheduleRecovery();

    async function recover() {

            let result;
            await task('Lokale Sicherung öffnen', async (opts) => result = await I.readProject(await K.unzip(record.data, opts), opts));
            setProject(result, 'Lokale Sicherung wiederhergestellt.');
            dirty = true;
            $('recovery-bar').hidden = true;
            render();
        };

        else
            await go();
    }

            recoveryCandidate = null;

    }
    function demoData() {
        const s = I.blank(), st = new I.AssetStore(), gid = I.uid('g'), settings = C.scene({ a: 5, b: 5 }), ps = C.positions(settings);
        s.project = {

        };
        s.scenes.push({ id: gid, name: 'tile_beispiel', source: 'custom', settings });

            const minY = Math.max(0, Math.floor(Math.min(...pts.map(p => p[1])))), maxY = Math.min(img.height, Math.ceil(Math.max(...pts.map(p => p[1]))));
            for (let y = minY; y < maxY; y++)
                for (let x = 0; x < img.width; x++) {
                    let inside = false;
                    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
                        const a = pts[i], b = pts[j];
                        if (((a[1] > y + .5) !== (b[1] > y + .5)) && (x + .5 < (b[0] - a[0]) * (y + .5 - a[1]) / (b[1] - a[1]) + a[0]))
                            inside = !inside;
                    }
                    if (inside) {
                        const noise = ((x * 13 + y * 7 + img.height * 3) % 9) - 4;
                        img.data.set([color[0] + noise, color[1] + noise, color[2] + noise, 255], (y * img.width + x) * 4);
                    }
                }
        };
        for (const p of ps) {
            const back = p.u === 4 || p.v === 4, h = back ? 112 : 32, img = C.image(64, h);
            polygon(img, [[32, h - 32], [64, h - 16], [32, h], [0, h - 16]], [132 + (p.slot % 3) * 5, 132 + (p.slot % 3) * 4, 113]);
            if (back) {
                const high = (p.u === 4 && p.v === 4) ? 14 : 24 + (p.slot % 3) * 7;
                polygon(img, [[0, h - 16], [32, h - 32], [32, high], [0, high + 16]], [151, 149, 135]);
                polygon(img, [[32, h - 32], [64, h - 16], [64, high + 16], [32, high]], [117, 119, 111]);
                polygon(img, [[0, high + 16], [32, high], [64, high + 16], [32, high + 32]], [179, 176, 158]);
                for (let y = high + 24; y < h - 28; y++)
                    for (let x = 2; x < 62; x++) {
                        const i = (y * 64 + x) * 4;
                        if (img.data[i + 3] && (y + Math.floor(Math.abs(x - 32) / 2)) % 13 === 0) {
                            img.data[i] = 91;
                            img.data[i + 1] = 94;
                            img.data[i + 2] = 89;
                        }
                    }
                if (p.slot % 3 === 1) {
                    polygon(img, [[24, h - 47], [35, h - 53], [35, h - 78], [24, h - 72]], [53, 61, 62]);
                }
            }
            else {
                for (let y = h - 27; y < h - 4; y++)
                    for (let x = 5; x < 59; x++) {
                        const i = (y * 64 + x) * 4;
                        if (img.data[i + 3] && ((x + y * 2 + p.slot * 3) % 31 === 0)) {
                            img.data[i] = 110;
                            img.data[i + 1] = 114;
                            img.data[i + 2] = 96;
                        }
                    }
            }
            const key = st.add(img), f = I.makeFrame(`tile_beispiel-${p.slot}.png`, key, gid, st);
            f.slot = p.slot;
            s.frames.push(f);
        }
        return { state: I.validate(s, st), store: st };
    }
